name: Journal Validation

"on":
  push:
  pull_request:
  workflow_dispatch:

# Daily submissions are owned by the ChatGPT task at 16:30 Asia/Kolkata.
# No parallel cron submitter and no Google session in this workflow.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check date, content, and duplicate guards
        run: python -m unittest -v test_daily_fill.py
